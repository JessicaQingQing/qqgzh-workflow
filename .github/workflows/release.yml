name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qqgzh-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
