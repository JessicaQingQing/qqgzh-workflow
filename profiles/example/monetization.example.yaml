# 商业转化素材（示例）

> ⚠️ 这是虚构品牌 "Harborfield Notes" 的示例。
> 复制到 `private/` 并替换为你自己的真实产品信息。

offers:
  - name: "Harborfield Field Guide"
    type: 付费指南
    description: >
      一本 12 周的练习册，每周一个可打印的反思模板，
      帮助读者从"计划太多做不完"过渡到"每周完成一件真正重要的事"。
    fit: 经常做计划但执行不到底的独立工作者
    evidence: 内测用户（n=34）报告周完成率从平均 38% 提升到 72%
    cta: "如果你想把文章里的方法变成固定习惯，Field Guide 可以陪你走 12 周。"
    不说的: 不保证收入提升，不承诺"改变人生"，不说"限时优惠"

  - name: "团队深度工作坊"
    type: 企业服务
    description: >
      半天到一天的线下/线上工作坊，帮小型团队建立异步协作规范和深度时间块制度。
    fit: 5-20 人的远程或混合办公团队，感觉会议太多、专注时间太少
    evidence: 已服务 6 个团队，引用公开的案例描述（见 knowledge 文件）
    cta: "如果你的团队也在被会议淹没，可以来聊聊。"
    不说的: 不虚报服务过的团队数，不列出客户名称（除非获得明确授权）

claims_policy:
  - 所有数据必须有内部记录可查
  - 不引用未公开或未经授权的内容
  - 不使用"最好""唯一""100%"等绝对化表述
  - 用户证言需获得书面同意后才可公开
